name: Java CI with Maven

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

  security-checks:
    runs-on: self-hosted
    needs: build

    steps:
      - uses: actions/checkout@v4
      

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Download Maven Dependencies
        run: mvn dependency:resolve

      - name: Trivy File System Scan
        run: |
          trivy fs --format table -o fs-report.txt .

      - name: Install Gitleaks
        run: |
          GITLEAKS_TAG=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/gitleaks/gitleaks/releases/latest | sed 's:.*/tag/::')
          wget "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_TAG}/gitleaks_${GITLEAKS_TAG#v}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_TAG#v}_linux_x64.tar.gz"
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks Scan
        run: |
          gitleaks detect --source . --report-path gitleaks-report.json --report-format json


  test:
        runs-on: self-hosted
        needs: security-checks
        steps:
          - uses: actions/checkout@v4
    
          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: "17"
              distribution: "temurin"
              cache: maven
    
          - name: Unit Test Cases
            run: mvn test    




  Sonar-San:
        runs-on: self-hosted
        needs: test
        steps:
          - uses: actions/checkout@v4
    
          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: "17"
              distribution: "temurin"
              cache: maven
    
          - name: Build Project  
            run: mvn package


          - uses: actions/checkout@v6
            with:
                # Disabling shallow clones is recommended for improving the relevancy of reporting
                fetch-depth: 0
          - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.2.1 # Ex: v4.1.0 or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL}}


              # Check the Quality Gate status.
          - name: SonarQube Quality Gate check
            id: sonarqube-quality-gate-check
            uses: sonarsource/sonarqube-quality-gate-action@master
            with:
              pollingTimeoutSec: 600
            env:
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }} #OPTIONAL
    

          



        
    
    
